name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore MediCare.slnx
      - run: dotnet build MediCare.slnx --configuration Release --no-restore
      - run: dotnet test tests/MediCare.Tests/MediCare.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=tests.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/MediCare.Tests/TestResults/*.trx
          if-no-files-found: ignore
